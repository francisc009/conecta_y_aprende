<!DOCTYPE html>
<html>
  <head>
    <title>Conecta y Aprende</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #312450, #5e42a6);
      }

      .contenedor {
        width: 900px;
        background: white;
        border-radius: 25px;
        overflow: hidden;
        display: flex;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
      }

      .info {
        flex: 1;
        padding: 60px;
        background: #4c3b88;
        color: white;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .info h1 {
        font-size: 3em;
        margin-bottom: 20px;
      }

      .info p {
        line-height: 1.8;
      }

      .formulario {
        flex: 1;
        padding: 50px;
      }

      .formulario h2 {
        margin-bottom: 30px;
        color: #312450;
      }

      input {
        width: 100%;
        padding: 15px;
        margin-bottom: 20px;
        border: none;
        background: #f2f2f2;
        border-radius: 10px;
      }

      button {
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 10px;
        background: #5e42a6;
        color: white;
        font-size: 16px;
        cursor: pointer;
      }

      button:hover {
        background: #312450;
      }

      .admin {
        margin-top: 20px;
        text-align: center;
      }

      .admin a {
        text-decoration: none;
        color: #5e42a6;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <div class="contenedor">
      <div class="info">
        <h1>Conecta y Aprende</h1>
        <p>
          Da el primer paso para comenzar tu capacitacion en mecanica
          automotriz.
        </p>
      </div>
      <div class="formulario">
        <h2>Registro</h2>
        <form action="index.html">
          <input type="text" placeholder="Nombre" required />
          <input type="number" placeholder="Edad" required />
          <button type="submit">Ingresar</button>
        </form>
        <div class="admin">
          <a href="admin.html">Ingresar como Administrador</a>
        </div>
      </div>
    </div>
  </body>
</html>
