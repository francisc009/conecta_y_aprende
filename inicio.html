<!DOCTYPE html>
<html>
  <head>
    <title>Conecta y Aprende</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial; }
      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #312450, #5e42a6);
      }
      .contenedor {
        width: 900px;
        background: white;
        border-radius: 25px;
        overflow: hidden;
        display: flex;
        box-shadow: 0 20px 50px rgba(0,0,0,0.3);
      }
      .info {
        flex: 1;
        padding: 60px;
        background: #4c3b88;
        color: white;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .info h1 { font-size: 2.8em; margin-bottom: 20px; }
      .info p { line-height: 1.8; opacity: 0.9; }
      .formulario { flex: 1; padding: 45px 50px; }
      .tabs {
        display: flex;
        margin-bottom: 28px;
        border-bottom: 2px solid #eee;
      }
      .tab {
        flex: 1;
        padding: 12px;
        text-align: center;
        cursor: pointer;
        font-size: 15px;
        font-weight: bold;
        color: #999;
        transition: 0.2s;
        border-bottom: 3px solid transparent;
        margin-bottom: -2px;
      }
      .tab.activo { color: #5e42a6; border-bottom-color: #5e42a6; }
      .campo-clave {
        position: relative;
        margin-bottom: 16px;
      }
      .campo-clave input {
        width: 100%;
        padding: 14px 45px 14px 14px;
        border: none;
        background: #f2f2f2;
        border-radius: 10px;
        font-size: 15px;
        outline: none;
        margin-bottom: 0;
      }
      .ojo {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        cursor: pointer;
        color: #888;
        font-size: 18px;
        padding: 4px;
        line-height: 1;
      }
      .ojo:hover { color: #5e42a6; }
      input {
        width: 100%;
        padding: 14px;
        margin-bottom: 16px;
        border: none;
        background: #f2f2f2;
        border-radius: 10px;
        font-size: 15px;
        outline: none;
      }
      button.principal {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 10px;
        background: #5e42a6;
        color: white;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
      }
      button.principal:hover { background: #312450; }
      .admin { margin-top: 18px; text-align: center; }
      .admin a { text-decoration: none; color: #5e42a6; font-weight: bold; font-size: 14px; }
      .msg {
        margin-top: 14px;
        padding: 10px;
        border-radius: 8px;
        font-size: 14px;
        display: none;
        text-align: center;
      }
      .msg.error { background: #fde8e8; color: #c0392b; }
      .msg.ok { background: #e8fde8; color: #27ae60; }
      .panel { display: none; }
      .panel.activo { display: block; }
    </style>
  </head>
  <body>
    <div class="contenedor">
      <div class="info">
        <h1>Conecta y Aprende</h1>
        <p>Da el primer paso para comenzar tu capacitación en mecánica automotriz y construir un futuro mejor.</p>
      </div>
      <div class="formulario">
        <div class="tabs">
          <div class="tab activo" onclick="cambiarTab('registro')">Nuevo usuario</div>
          <div class="tab" onclick="cambiarTab('login')">Ya tengo cuenta</div>
        </div>

        <!-- Registro -->
        <div id="panel-registro" class="panel activo">
          <input type="text" id="reg-nombre" placeholder="Nombre de usuario" />
          <input type="number" id="reg-edad" placeholder="Edad" min="1" max="99" />
          <div class="campo-clave">
            <input type="password" id="reg-clave" placeholder="Contraseña" />
            <button class="ojo" type="button" onclick="toggleClave('reg-clave', this)" title="Mostrar/ocultar contraseña">Ver</button>
          </div>
          <button class="principal" onclick="registrar()">Registrarse</button>
          <div id="msg-registro" class="msg"></div>
        </div>

        <!-- Login -->
        <div id="panel-login" class="panel">
          <input type="text" id="log-nombre" placeholder="Nombre de usuario" />
          <div class="campo-clave">
            <input type="password" id="log-clave" placeholder="Contraseña" />
            <button class="ojo" type="button" onclick="toggleClave('log-clave', this)" title="Mostrar/ocultar contraseña">Ver</button>
          </div>
          <button class="principal" onclick="entrar()">Entrar</button>
          <div id="msg-login" class="msg"></div>
        </div>

        <div class="admin">
          <a href="admin.html">Ingresar como Administrador</a>
        </div>
      </div>
    </div>

    <script>
      function cambiarTab(tab) {
        document.querySelectorAll(".tab").forEach((t, i) => {
          t.classList.toggle("activo", (i === 0 && tab === "registro") || (i === 1 && tab === "login"));
        });
        document.getElementById("panel-registro").classList.toggle("activo", tab === "registro");
        document.getElementById("panel-login").classList.toggle("activo", tab === "login");
      }

      function toggleClave(inputId, btn) {
        const inp = document.getElementById(inputId);
        if (inp.type === "password") {
          inp.type = "text";
          btn.style.opacity = "1";
          btn.style.color = "#5e42a6";
        } else {
          inp.type = "password";
          btn.style.opacity = "0.6";
          btn.style.color = "#888";
        }
      }

      function mostrarMsg(id, tipo, texto) {
        const el = document.getElementById(id);
        el.className = "msg " + tipo;
        el.textContent = texto;
        el.style.display = "block";
      }

      function guardarSesion(id, nombre) {
        localStorage.setItem("usuario_conecta", JSON.stringify({ id, nombre }));
        setTimeout(() => { window.location.href = "index.html"; }, 1000);
      }

      async function registrar() {
        const nombre = document.getElementById("reg-nombre").value.trim();
        const edad   = document.getElementById("reg-edad").value.trim();
        const clave  = document.getElementById("reg-clave").value.trim();
        if (!nombre || !edad || !clave) {
          return mostrarMsg("msg-registro", "error", "Completa todos los campos");
        }
        try {
          const r = await fetch("/registro", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ nombre, edad: parseInt(edad), clave })
          });
          const d = await r.json();
          if (d.ok) {
            mostrarMsg("msg-registro", "ok", "¡Registro exitoso! Entrando...");
            guardarSesion(d.id, d.nombre);
          } else {
            mostrarMsg("msg-registro", "error", d.mensaje || "Error al registrar");
          }
        } catch {
          mostrarMsg("msg-registro", "error", "No se pudo conectar con el servidor");
        }
      }

      async function entrar() {
        const nombre = document.getElementById("log-nombre").value.trim();
        const clave  = document.getElementById("log-clave").value.trim();
        if (!nombre || !clave) {
          return mostrarMsg("msg-login", "error", "Completa todos los campos");
        }
        try {
          const r = await fetch("/usuario/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ nombre, clave })
          });
          const d = await r.json();
          if (d.ok) {
            mostrarMsg("msg-login", "ok", "¡Bienvenido, " + d.nombre + "! Entrando...");
            guardarSesion(d.id, d.nombre);
          } else {
            mostrarMsg("msg-login", "error", d.mensaje || "Datos incorrectos");
          }
        } catch {
          mostrarMsg("msg-login", "error", "No se pudo conectar con el servidor");
        }
      }

      document.addEventListener("keydown", e => {
        if (e.key === "Enter") {
          if (document.getElementById("panel-registro").classList.contains("activo")) registrar();
          else entrar();
        }
      });
    </script>
  </body>
</html>
