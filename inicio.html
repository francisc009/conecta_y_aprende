<!DOCTYPE html>
<html>
  <head>
    <title>Conecta y Aprende</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #312450, #5e42a6);
      }

      .contenedor {
        width: 900px;
        background: white;
        border-radius: 25px;
        overflow: hidden;
        display: flex;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
      }

      .info {
        flex: 1;
        padding: 60px;
        background: #4c3b88;
        color: white;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .info h1 {
        font-size: 3em;
        margin-bottom: 20px;
      }

      .info p {
        line-height: 1.8;
      }

      .formulario {
        flex: 1;
        padding: 50px;
      }

      .formulario h2 {
        margin-bottom: 30px;
        color: #312450;
      }

      input {
        width: 100%;
        padding: 15px;
        margin-bottom: 20px;
        border: none;
        background: #f2f2f2;
        border-radius: 10px;
        font-size: 15px;
        outline: none;
      }

      button {
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 10px;
        background: #5e42a6;
        color: white;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
      }

      button:hover {
        background: #312450;
      }

      .admin {
        margin-top: 20px;
        text-align: center;
      }

      .admin a {
        text-decoration: none;
        color: #5e42a6;
        font-weight: bold;
      }

      .mensaje {
        margin-top: 15px;
        padding: 10px;
        border-radius: 8px;
        font-size: 14px;
        display: none;
        text-align: center;
      }

      .mensaje.error {
        background: #fde8e8;
        color: red;
      }

      .mensaje.ok {
        background: #e8fde8;
        color: green;
      }
    </style>
  </head>

  <body>
    <div class="contenedor">
      <div class="info">
        <h1>Conecta y Aprende</h1>
        <p>
          Da el primer paso para comenzar tu capacitacion en mecanica
          automotriz.
        </p>
      </div>
      <div class="formulario">
        <h2>Registro</h2>
        <input type="text" id="nombre" placeholder="Nombre" />
        <input type="number" id="edad" placeholder="Edad" min="1" />
        <button onclick="registrar()">Ingresar</button>

        <div id="mensaje" class="mensaje"></div>

        <div class="admin">
          <a href="admin.html">Ingresar como Administrador</a>
        </div>
      </div>
    </div>

    <script>
      async function registrar() {
        const nombre = document.getElementById("nombre").value.trim();
        const edad = document.getElementById("edad").value.trim();
        const msg = document.getElementById("mensaje");

        msg.style.display = "none";

        if (!nombre || !edad) {
          msg.className = "mensaje error";
          msg.innerText = "Completa todos los campos";
          msg.style.display = "block";
          return;
        }

        try {
          const respuesta = await fetch("/registro", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ nombre, edad: parseInt(edad) }),
          });

          const datos = await respuesta.json();

          if (datos.ok) {
            msg.className = "mensaje ok";
            msg.innerText = "Registro exitoso. Bienvenido!";
            msg.style.display = "block";
            setTimeout(() => {
              window.location.href = "index.html";
            }, 1200);
          } else {
            msg.className = "mensaje error";
            msg.innerText = datos.mensaje || "Error al registrar";
            msg.style.display = "block";
          }
        } catch (error) {
          msg.className = "mensaje error";
          msg.innerText = "No se pudo conectar con el servidor";
          msg.style.display = "block";
          console.error(error);
        }
      }

      document.addEventListener("keydown", (e) => {
        if (e.key === "Enter") registrar();
      });
    </script>
  </body>
</html>
